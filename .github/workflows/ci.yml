name: CI

on:
  # paths-ignore skips a run only when every changed file matches, so a mixed PR
  # still runs this pipeline. android/ has no C++/Qt/QML surface and builds separately.
  pull_request:
    paths-ignore:
      - "android/**"
  push:
    branches: [main]
    paths-ignore:
      - "android/**"

# A newer push to the same ref cancels the in-flight run - no point burning a
# ~hours-long cold Qt build on a commit that has already been superseded.
concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

permissions:
  contents: read
  packages: write

env:
  # Read/write the public GitHub Packages NuGet feed as vcpkg's binary cache.
  # Public repo => unlimited package storage/transfer; Qt is built once per ABI.
  VCPKG_BINARY_SOURCES: "clear;nuget,https://nuget.pkg.github.com/aloknigam247/index.json,readwrite"

jobs:
  # Enforce the clang-format standard (.clang-format) on every C++ source. This
  # only needs clang-format, not Qt/vcpkg, so it runs on Linux in ~1 min in
  # parallel with the heavy build job and fails fast on unformatted code. The
  # version is pinned: clang-format output drifts between major releases, so a
  # newer default would produce spurious diffs against the standard.
  format-lint:
    name: format-lint
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v5
      - uses: actions/setup-python@v5
        with:
          python-version: "3.14"

      - name: Install clang-format
        run: pip install clang-format==22.1.8

      - name: Check formatting
        shell: pwsh
        run: |
          $files = git ls-files 'src/*.cpp' 'src/*.h' 'include/*.h' 'include/*.hpp' 'tests/*.cpp' 'tests/*.h'
          if (-not $files) { throw "no C++ sources matched — check the ls-files globs." }
          Write-Host "checking $($files.Count) file(s) against .clang-format"
          clang-format --dry-run -Werror --style=file:.clang-format @files
          if ($LASTEXITCODE -ne 0) {
            throw "clang-format found unformatted code. Run: clang-format -i --style=file:.clang-format <files>"
          }

  # Enforce the clang-tidy check set (.clang-tidy) over the first-party translation
  # units (src/ + include/). clang-tidy needs the real compile flags, so this restores
  # Qt and configures the Ninja `tidy` preset to emit compile_commands.json, then runs
  # clang-tidy per TU. Diagnostics are path-scoped to src/ + include/ so the vendored
  # msgpack analyzer note (out of our tree, not fixable here) can never gate the build.
  # clang-tidy is version-pinned like clang-format: tidy diagnostics drift across major
  # releases, so an unpinned newer default would flag or miss checks unpredictably.
  tidy:
    name: tidy
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v5
      - uses: ./.github/actions/setup-qvim
        with:
          github-token: ${{ secrets.GITHUB_TOKEN }}
      - uses: actions/setup-python@v5
        with:
          python-version: "3.14"
      # The Ninja `tidy` preset drives cl directly (unlike the VS-generator dev
      # preset, which locates the toolset itself), so cl + the MSVC env must be on
      # PATH before configure.
      - uses: ilammy/msvc-dev-cmd@v1

      - name: Install clang-tidy
        run: pip install clang-tidy==22.1.8

      - name: Guard against /*unused*/ parameter placeholders
        shell: pwsh
        # readability-named-parameter wants an unused parameter documented with a
        # descriptive /* name */ comment, not a bare /*unused*/ placeholder. clang-tidy
        # accepts the latter, so guard it here to keep the intent readable.
        run: |
          $hits = git ls-files 'src/*.cpp' 'src/*.h' 'include/*.h' 'include/*.hpp' |
            Select-String -Pattern '/\*\s*unused\s*\*/'
          if ($hits) {
            $hits | ForEach-Object { Write-Host $_.ToString() }
            throw "Found /*unused*/ placeholder(s). Name the parameter in a /* descriptive */ comment instead."
          }

      - name: Configure tidy preset (compile_commands.json)
        shell: pwsh
        run: |
          cmake --preset tidy
          if ($LASTEXITCODE -ne 0) { throw "tidy preset configure failed with exit code $LASTEXITCODE." }
          if (-not (Test-Path build/tidy/compile_commands.json)) {
            throw "build/tidy/compile_commands.json was not generated."
          }

      - name: Run clang-tidy
        shell: pwsh
        # Assert every tracked src/ TU is in the compile DB (guards against clang-tidy
        # silently analyzing nothing), then run it per TU and keep only diagnostics
        # whose file resolves under src/ or include/ — vendored/build-tree paths (e.g.
        # msgpack under build/tidy/vcpkg_installed) are dropped so they cannot gate.
        run: |
          $db = Get-Content build/tidy/compile_commands.json -Raw | ConvertFrom-Json
          $dbFiles = $db | ForEach-Object { ($_.file -replace '/', '\').ToLower() }
          $tus = git ls-files 'src/*.cpp'
          if (-not $tus) { throw "no src/*.cpp translation units matched." }
          $root = (git rev-parse --show-toplevel) -replace '/', '\'
          foreach ($tu in $tus) {
            $abs = (Join-Path $root ($tu -replace '/', '\')).ToLower()
            if ($dbFiles -notcontains $abs) {
              throw "TU '$tu' is missing from compile_commands.json — clang-tidy would not analyze it."
            }
          }
          Write-Host "confirmed $($tus.Count) src/ TU(s) present in the compile DB"
          $findings = [System.Collections.Generic.List[string]]::new()
          foreach ($tu in $tus) {
            Write-Host "== clang-tidy $tu =="
            $out = clang-tidy -p build/tidy --quiet "$tu" 2>&1 | Out-String
            Write-Host $out
            foreach ($line in ($out -split "`n")) {
              if ($line -match '^(.*?):\d+:\d+:\s+(warning|error):') {
                $norm = $Matches[1] -replace '/', '\'
                if ($norm -match '\\(src|include)\\' -and $norm -notmatch 'vcpkg_installed' -and $norm -notmatch '\\build\\') {
                  $findings.Add($line.Trim())
                }
              }
            }
          }
          if ($findings.Count -gt 0) {
            Write-Host "`n=== first-party clang-tidy findings (src/ + include/) ==="
            $findings | Sort-Object -Unique | ForEach-Object { Write-Host $_ }
            throw "clang-tidy reported first-party finding(s); the .clang-tidy set must stay baseline-clean."
          }
          Write-Host "clang-tidy: 0 first-party findings across $($tus.Count) TU(s)."

  # Seed the vcpkg binary cache AND compile qvim exactly once. On a cold cache
  # the setup-qvim configure cold-builds Qt (~1-3 h) and pushes it to the NuGet
  # feed; every later job then RESTORES Qt in minutes. Compiling here (not in
  # each downstream job) means a build break fails fast in one place instead of
  # four, and the compiled test tree is shared via an artifact so the test /
  # coverage jobs skip the ~11 min rebuild.
  build:
    name: build
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v5
      - uses: ./.github/actions/setup-qvim
        with:
          github-token: ${{ secrets.GITHUB_TOKEN }}

      - name: Build
        shell: pwsh
        # --parallel uses all runner cores (MSBuild builds the ~57 targets
        # serially otherwise). This is the seed job's dominant cost.
        run: cmake --build --preset dev --parallel

      # Share the compiled tree (test exes + qvim.exe deploy + PDBs for native
      # coverage). Downstream jobs still run setup-qvim to restore Qt onto PATH
      # and regenerate the ctest config, then drop these exes back into
      # build/dev/Debug and run ctest without recompiling. The GitHub-hosted
      # checkout path is identical across jobs (D:\a\qvim\qvim), so the absolute
      # paths baked into CTestTestfile.cmake resolve.
      - name: Upload compiled test tree
        uses: actions/upload-artifact@v7
        with:
          name: build-dev-debug
          path: build/dev/Debug
          retention-days: 1
          if-no-files-found: error

  test:
    name: test-${{ matrix.tier }}
    needs: build
    runs-on: windows-latest
    strategy:
      fail-fast: false
      matrix:
        tier: [unit, integration, qml]
    steps:
      - uses: actions/checkout@v5
      - uses: ./.github/actions/setup-qvim
        with:
          github-token: ${{ secrets.GITHUB_TOKEN }}

      - name: Download compiled test tree
        uses: actions/download-artifact@v8
        with:
          name: build-dev-debug
          path: build/dev/Debug

      - name: Collect coverage (${{ matrix.tier }})
        shell: pwsh
        # Run this tier's tests once, under native coverage instrumentation, and
        # emit a per-tier cobertura. coverage-gate unions the three tiers (= whole
        # suite, since every test carries exactly one tier label) and enforces the
        # floor. Debug build (RelWithDebInfo reports covered=0 due to inlining).
        # The unit tier is headless/CPU-bound so its tests run in parallel across
        # the runner's cores (the one timing-sensitive unit test is RUN_SERIAL, see
        # tests/CMakeLists.txt). The integration tier stays serial: real nvim +
        # waitUntil timeouts on a busy CI runner flake when the CPU is contended.
        # test_pixel_snapshot compares against a golden BMP rasterized on a
        # developer machine; the CI runner's Courier New anti-aliases differently
        # and blows the pixel budget, so it stays a local-only visual aid (see #44).
        run: |
          $vswhere = "${env:ProgramFiles(x86)}\Microsoft Visual Studio\Installer\vswhere.exe"
          $vs = & $vswhere -latest -property installationPath
          $cc = Get-ChildItem "$vs\Common7\IDE\Extensions\Microsoft\CodeCoverage.Console\Microsoft.CodeCoverage.Console.exe" `
                  -ErrorAction SilentlyContinue | Select-Object -First 1 -ExpandProperty FullName
          if (-not $cc) {
            throw "Microsoft.CodeCoverage.Console.exe not found under '$vs'. Install the VS 'Code coverage tools' component."
          }
          $ctestArgs = @('--preset','dev','-L','${{ matrix.tier }}','-E','test_pixel_snapshot','--output-on-failure')
          if ('${{ matrix.tier }}' -eq 'unit') { $ctestArgs += @('--parallel', $env:NUMBER_OF_PROCESSORS) }
          New-Item -ItemType Directory -Force _cov | Out-Null
          & $cc collect --output _cov\${{ matrix.tier }}.cobertura --output-format cobertura `
            --settings cov.runsettings -- ctest @ctestArgs
          if ($LASTEXITCODE -ne 0) { throw "coverage collect / ctest failed with exit code $LASTEXITCODE." }

      - name: Upload tier coverage
        uses: actions/upload-artifact@v7
        with:
          name: cov-${{ matrix.tier }}
          path: _cov/${{ matrix.tier }}.cobertura
          retention-days: 1
          if-no-files-found: error

      # Guard that every registered test carries exactly one tier label, so the
      # three parallel tiers together cover the whole suite (nothing silently
      # drops out of all of them). Runs once, on the unit shard.
      - name: Tier-label union guard
        if: matrix.tier == 'unit'
        shell: pwsh
        run: |
          function Count($extra) {
            (ctest --preset dev -N @extra | Select-String 'Test\s+#\d+:').Count
          }
          $all = Count @()
          $u   = Count @('-L','unit')
          $i   = Count @('-L','integration')
          $q   = Count @('-L','qml')
          Write-Host "all=$all unit=$u integration=$i qml=$q sum=$($u+$i+$q)"
          if (($u + $i + $q) -ne $all) {
            throw "Tier-label union ($($u + $i + $q)) != total tests ($all). Every test must carry exactly one of unit/integration/qml (see tests/CMakeLists.txt)."
          }

  coverage-gate:
    name: coverage-gate
    needs: test
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v5

      - name: Download tier coverage
        uses: actions/download-artifact@v8
        with:
          pattern: cov-*
          path: _cov
          merge-multiple: true

      # Union the per-tier coberturas and enforce the floor. No Qt/build/nvim
      # needed here — this only parses XML — so the gate is a ~1 min job that runs
      # after the three (parallel) instrumented tiers, not a whole-suite re-run.
      - name: Enforce coverage floor
        shell: pwsh
        run: |
          $reports = (Get-ChildItem _cov\*.cobertura).FullName
          if (-not $reports) { throw "no per-tier cobertura reports found under _cov/." }
          Write-Host "unioning $($reports.Count) tier report(s):`n$($reports -join "`n")"
          & scripts\coverage-union.ps1 -CoberturaPath $reports
